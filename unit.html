<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter - ToolAadi</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}
.box{
  max-width:450px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
  text-align:center;
}
select,input{
  width:90%;
  padding:13px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button{
  width:95%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:17px;
  margin-top:10px;
}
#result{
  margin-top:20px;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h1>Unit Converter</h1>
<p>Convert common units easily</p>

<input type="number" id="value" placeholder="Enter value">

<select id="conversion">
<option value="km-mi">Kilometers → Miles</option>
<option value="mi-km">Miles → Kilometers</option>
<option value="m-ft">Meters → Feet</option>
<option value="ft-m">Feet → Meters</option>
<option value="kg-lb">Kilograms → Pounds</option>
<option value="lb-kg">Pounds → Kilograms</option>
<option value="cm-in">Centimeters → Inches</option>
<option value="in-cm">Inches → Centimeters</option>
</select>

<button onclick="convert()">Convert</button>

<div id="result"></div>
</div>

<script>
function convert(){

let value=parseFloat(document.getElementById("value").value);
let type=document.getElementById("conversion").value;

if(isNaN(value)){
document.getElementById("result").innerHTML="Please enter a value.";
return;
}

let result;

if(type==="km-mi") result=value*0.621371;
if(type==="mi-km") result=value*1.609344;
if(type==="m-ft") result=value*3.28084;
if(type==="ft-m") result=value*0.3048;
if(type==="kg-lb") result=value*2.20462;
if(type==="lb-kg") result=value*0.453592;
if(type==="cm-in") result=value*0.393701;
if(type==="in-cm") result=value*2.54;

document.getElementById("result").innerHTML=
"Result: "+result.toFixed(4);
}
</script>

</body>
  </html>
